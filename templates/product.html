{% extends 'base.html' %}

{% block title %}{{ product.name }}{% endblock %}

{% block content %}
<div class="row">
  <div class="col-md-8">
    <h1>{{ product.name }}</h1>
    <p>{{ product.description }}</p>
    <p><strong>${{ '%.2f' % (product.price_cents / 100) }}</strong></p>
    <p><small class="text-muted">SKU: {{ product.sku }}</small></p>
    <a href="{{ url_for('edit_product', product_id=product.id) }}" class="btn btn-primary">Edit</a>

    <form action="{{ url_for('delete_product', product_id=product.id) }}" method="post" style="display:inline;" onsubmit="return confirm('Delete this product?');">
      <button type="submit" class="btn btn-danger">Delete</button>
    </form>
  </div>
</div>
{% endblock %}
