{% extends 'base.html' %}

{% block title %}Edit {{ product.name }}{% endblock %}

{% block content %}
<h1>Edit Product</h1>
<form method="post" action="{{ url_for('edit_product', product_id=product.id) }}">
  <div class="form-group">
    <label for="name">Name</label>
    <input required class="form-control" id="name" name="name" value="{{ product.name }}">
  </div>
  <div class="form-group">
    <label for="description">Description</label>
    <textarea class="form-control" id="description" name="description">{{ product.description }}</textarea>
  </div>
  <div class="form-group">
    <label for="price">Price (dollars)</label>
    <input required type="number" step="0.01" class="form-control" id="price" name="price" value="{{ '%.2f' % (product.price_cents / 100) }}">
  </div>
  <div class="form-group">
    <label for="sku">SKU</label>
    <input class="form-control" id="sku" name="sku" value="{{ product.sku }}">
  </div>
  <button class="btn btn-primary" type="submit">Save</button>
  <a class="btn btn-secondary" href="{{ url_for('product_detail', product_id=product.id) }}">Cancel</a>
</form>
{% endblock %}
